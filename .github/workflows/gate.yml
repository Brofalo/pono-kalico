name: gate
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    # Local, not PONOdata/gatekeeper: this repo is public and gatekeeper is
    # private, and a public repo cannot call a private repo's reusable
    # workflow. The local copy is the workaround, not drift.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_labels: '["ubuntu-latest"]'
      # Every command here was blank, so gate/lint, gate/typecheck, gate/test
      # and gate/build were required while running nothing. This is printer
      # firmware: the thing these checks guard moves a heated nozzle over a
      # bed, and the required checks in front of it verified nothing.
      #
      # Ruff, Build test and Docs test already run all of this on pull_request
      # and are green. None of them is a required check, so any of them could
      # go red and the PR would still merge. These are the same commands,
      # wired into the gate that merge protection actually enforces.
      #
      # ruff is capped below 0.16 to match the pyproject dev group. The
      # comment on that pin is explicit: 0.16 expanded the default rule set
      # and takes this tree from 2 errors to 2222. Raise it deliberately.
      lint_cmd: >-
        curl -LsSf https://astral.sh/uv/install.sh | sh
        && export PATH="$HOME/.local/bin:$PATH"
        && uv tool run --from "ruff>=0.9.3,<0.16" ruff check .
        && uv tool run --from "ruff>=0.9.3,<0.16" ruff format --check .
      # One interpreter, not the six the Build test matrix runs. That matrix
      # still runs on every PR and keeps the version spread covered; this is
      # the copy that has to be green before a merge is allowed, so it is
      # sized to be fast enough that nobody wants to bypass it.
      test_cmd: >-
        docker pull dangerklippers/klipper-build:latest
        && docker run -v "$PWD":/klipper dangerklippers/klipper-build:latest
        --python 3.12 py.test -n auto
      # build is ARMED, and it will be RED until the divide work lands. That is
      # the point of it, not a fault in the wiring. Read this before assuming
      # the gate is broken.
      #
      # Every link failure is fixed. ar100 overflowed SRAM_A2, and because
      # ci-build.sh walks test/configs alphabetically under set -e, ar100 was
      # only the first of six: atmega644p, atmega1280, atmega2560, stm32f031,
      # stm32f042 and stm32f070 were all failing to link behind it. All of
      # them build now.
      #
      # What still fails is check-software-div.sh, on 30 of the 39 targets,
      # and it predates all of this. Two independent causes:
      #
      #   1. sensor_hx711s.c:102 recomputes a high-pass coefficient per sample
      #      with float division, so __divsf3 links in. Proven sole cause on
      #      ARM: at32f403 and stm32f405 carry no divide symbols at all with
      #      CONFIG_WANT_HX711S=n. Fixing it means the host sends the
      #      coefficient and the MCU only multiplies, which is a protocol
      #      change to the probe path and wants a bench check on the load cell.
      #   2. The AVR targets carry __divmodsi4 and __udivmodsi4 with hx711s
      #      switched off entirely. Nothing to do with the load cell.
      #
      # So this gate goes green only after the divide work. It is armed anyway,
      # because the alternative is the state this repo was already in: a
      # required check passing over a firmware nobody had compiled. A gate that
      # is red because the firmware is broken is the gate working. Build test
      # runs the same compile on pull_request, but behind a dorny/paths-filter
      # over src/, lib/, Makefile and friends, so a PR touching none of them
      # skips it and reports green. No paths-filter here, on purpose.
      #
      # The image builds every target in test/configs and then runs py.test,
      # which is also what makes it the slowest gate. If it starts timing out,
      # raise timeout-minutes on the build job in reusable-ci.yml rather than
      # narrowing what it compiles.
      #
      # typecheck: no typechecker is configured in this tree, and Kalico
      # follows upstream Klipper's layout with no annotations to check.
      build_cmd: >-
        docker build --progress=plain -f scripts/Dockerfile-build
        -t dangerklippers/klipper-build:gate .
      unconfigured_ok: "typecheck"
      run_semgrep: true
      run_dependency_review: true
