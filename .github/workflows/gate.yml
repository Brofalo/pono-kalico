name: gate
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    # Local, not PONOdata/gatekeeper: this repo is public and gatekeeper is
    # private, and a public repo cannot call a private repo's reusable
    # workflow. The local copy is the workaround, not drift.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_labels: '["ubuntu-latest"]'
      # Every command here was blank, so gate/lint, gate/typecheck, gate/test
      # and gate/build were required while running nothing. This is printer
      # firmware: the thing these checks guard moves a heated nozzle over a
      # bed, and the required checks in front of it verified nothing.
      #
      # Ruff, Build test and Docs test already run all of this on pull_request
      # and are green. None of them is a required check, so any of them could
      # go red and the PR would still merge. These are the same commands,
      # wired into the gate that merge protection actually enforces.
      #
      # ruff is capped below 0.16 to match the pyproject dev group. The
      # comment on that pin is explicit: 0.16 expanded the default rule set
      # and takes this tree from 2 errors to 2222. Raise it deliberately.
      lint_cmd: >-
        curl -LsSf https://astral.sh/uv/install.sh | sh
        && export PATH="$HOME/.local/bin:$PATH"
        && uv tool run --from "ruff>=0.9.3,<0.16" ruff check .
        && uv tool run --from "ruff>=0.9.3,<0.16" ruff format --check .
      # One interpreter, not the six the Build test matrix runs. That matrix
      # still runs on every PR and keeps the version spread covered; this is
      # the copy that has to be green before a merge is allowed, so it is
      # sized to be fast enough that nobody wants to bypass it.
      test_cmd: >-
        docker pull dangerklippers/klipper-build:latest
        && docker run -v "$PWD":/klipper dangerklippers/klipper-build:latest
        --python 3.12 py.test -n auto
      # build is ARMED. It compiles every target in test/configs and then runs
      # py.test, and nothing about it is gated on which paths a PR touched.
      #
      # It was declared in unconfigured_ok before this, because arming it found
      # a firmware that did not build, in four separate ways. Recorded here
      # because each one was invisible behind the one in front of it:
      #
      #   1. ar100 overflowed SRAM_A2, out of sensor_hx711s.c static buffers
      #      sized for a calibration ceiling the probe path never approaches.
      #   2. ci-build.sh walks test/configs alphabetically under set -e, and
      #      ar100 sorts first, so atmega644p, atmega1280, atmega2560,
      #      stm32f031, stm32f042 and stm32f070 were all failing to link
      #      behind it, unreported.
      #   3. load_cell_fusion.c averaged by a variable sensor_count, which
      #      links __divmodsi4 on a core with no divide instruction.
      #   4. sensor_hx711s.c rebuilt its high-pass coefficient per sample with
      #      float division, and did integer division in the trigger path.
      #
      # All four are fixed, and check-software-div.sh now also catches the
      # __aeabi_* divide aliases it used to be blind to, so a Cortex-M0 image
      # can no longer divide in software and still pass.
      #
      # Keep it armed. The state this replaces was a required check that passed
      # over a firmware nobody had compiled: Build test runs the same compile on
      # pull_request, but behind a dorny/paths-filter over src/, lib/, Makefile
      # and friends, so a PR touching none of them skips the compile and reports
      # green. That is how all four defects above sat behind checks that looked
      # passing. No paths-filter here, on purpose.
      #
      # Cost, measured rather than guessed, because the first two runs of this
      # gate looked like a budget problem and were not. A whole test/configs
      # sweep is 2m46s at the -j2 ci-build.sh hardcodes, on 2 cores, and the
      # job as a whole finished in about 5 minutes. The 30 minute
      # timeout-minutes on the build job in reusable-ci.yml is not tight.
      #
      # The two runs that suggested otherwise were both a sick hosted runner:
      # one could not resolve registry-1.docker.io at all, the next fetched
      # 31.9MB of apt at 66kB/s and was still going when the timeout killed it.
      # If this gate fails on a registry or DNS error, re-run it before
      # touching the timeout or narrowing what it compiles.
      #
      # typecheck: no typechecker is configured in this tree, and Kalico
      # follows upstream Klipper's layout with no annotations to check.
      build_cmd: >-
        docker build --progress=plain -f scripts/Dockerfile-build
        -t dangerklippers/klipper-build:gate .
      unconfigured_ok: "typecheck"
      run_semgrep: true
      run_dependency_review: true
