name: gate
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    # Local, not PONOdata/gatekeeper: this repo is public and gatekeeper is
    # private, and a public repo cannot call a private repo's reusable
    # workflow. The local copy is the workaround, not drift.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      runner_labels: '["ubuntu-latest"]'
      # Every command here was blank, so gate/lint, gate/typecheck, gate/test
      # and gate/build were required while running nothing. This is printer
      # firmware: the thing these checks guard moves a heated nozzle over a
      # bed, and the required checks in front of it verified nothing.
      #
      # Ruff, Build test and Docs test already run all of this on pull_request
      # and are green. None of them is a required check, so any of them could
      # go red and the PR would still merge. These are the same commands,
      # wired into the gate that merge protection actually enforces.
      #
      # ruff is capped below 0.16 to match the pyproject dev group. The
      # comment on that pin is explicit: 0.16 expanded the default rule set
      # and takes this tree from 2 errors to 2222. Raise it deliberately.
      lint_cmd: >-
        curl -LsSf https://astral.sh/uv/install.sh | sh
        && export PATH="$HOME/.local/bin:$PATH"
        && uv tool run --from "ruff>=0.9.3,<0.16" ruff check .
        && uv tool run --from "ruff>=0.9.3,<0.16" ruff format --check .
      # One interpreter, not the six the Build test matrix runs. That matrix
      # still runs on every PR and keeps the version spread covered; this is
      # the copy that has to be green before a merge is allowed, so it is
      # sized to be fast enough that nobody wants to bypass it.
      test_cmd: >-
        docker pull dangerklippers/klipper-build:latest
        && docker run -v "$PWD":/klipper dangerklippers/klipper-build:latest
        --python 3.12 py.test -n auto
      # build is ARMED. It was held back through three separate defects, all of
      # which are now fixed, and it was arming it that found every one of them.
      #
      # Link failures first. ar100 overflowed SRAM_A2, and because ci-build.sh
      # walks test/configs alphabetically under set -e, ar100 was only the first
      # of six: atmega644p, atmega1280, atmega2560, stm32f031, stm32f042 and
      # stm32f070 were all failing to link behind it. Fixed in #14.
      #
      # Then check-software-div.sh, which failed 30 of the 39 targets from three
      # independent causes, none of which the link fix owned:
      #
      #   1. load_cell_fusion.c averaged by a variable sensor_count, which is a
      #      run-time divide. Present with hx711s switched off entirely, and
      #      pulled in by WANT_HX71X or WANT_ADS1220 rather than the load cell
      #      probe. Fixed in #18.
      #   2. sensor_hx711s.c recomputed the high-pass coefficient per sample
      #      with float division, so __divsf3 linked in. The host sends both
      #      coefficients now. Fixed in #19.
      #   3. sensor_hx711s.c had six run-time integer divides, four of them per
      #      sample. Invisible on Cortex-M3 and above, which divide in hardware,
      #      so this one only showed on AVR and Cortex-M0. Fixed in #20.
      #
      # Measured on the merge of all three, every target in test/configs built
      # in the pinned toolchain: 39 pass, 0 fail, 0 link failures, and the
      # klippy suite at 88 passed 1 xfailed. Searching for divide helpers under
      # any name, including the __aeabi_* aliases check-software-div.sh cannot
      # match, 35 of 39 images are completely clean and the only four carrying
      # one are hc32f460 x2, rp2040 and samd21g18, which all legitimately set
      # CONFIG_HAVE_SOFTWARE_DIVIDE_REQUIRED=y.
      #
      # Build test runs the same compile on pull_request, but behind a
      # dorny/paths-filter over src/, lib/, Makefile and friends, so a PR
      # touching none of them skips it and reports green. This gate carries no
      # paths-filter, on purpose.
      #
      # The image builds every target in test/configs and then runs py.test,
      # which is also what makes it the slowest gate. If it starts timing out,
      # raise timeout-minutes on the build job in reusable-ci.yml rather than
      # narrowing what it compiles. A registry or DNS error from a sick hosted
      # runner looks the same as a timeout; re-run before touching either.
      #
      build_cmd: >-
        docker build --progress=plain -f scripts/Dockerfile-build
        -t dangerklippers/klipper-build:gate .
      # typecheck: no typechecker is configured in this tree, and Kalico
      # follows upstream Klipper's layout with no annotations to check.
      unconfigured_ok: "typecheck"
      run_semgrep: true
      run_dependency_review: true
